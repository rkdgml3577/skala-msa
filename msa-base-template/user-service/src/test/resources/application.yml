spring:
  datasource:
    url: jdbc:h2:mem:user_test;MODE=MariaDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    discovery:
      enabled: false
  kafka:
    bootstrap-servers: localhost:1
    admin:
      fail-fast: false
    listener:
      auto-startup: false
    consumer:
      group-id: user-service-test

eureka:
  client:
    enabled: false

kafka:
  topic:
    user-created: user.created
