spring:
  datasource:
    url: jdbc:h2:mem:course_test;MODE=MariaDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    discovery:
      enabled: false
  kafka:
    bootstrap-servers: localhost:1
    admin:
      fail-fast: false
    listener:
      auto-startup: false
    consumer:
      group-id: course-service-test

eureka:
  client:
    enabled: false

kafka:
  topic:
    item-created: item.created
    payment-completed: payment.completed

scheduler:
  item-count:
    fixed-delay: 3600000
