# MSA 베이스 템플릿 - 로컬 소스 빌드 실행 환경
#
# 핵심 스택만 실행:
#   docker compose up -d --build
#
# Auth Server + API Gateway(사전 빌드 이미지)까지 포함해 실행:
#   docker load -i infra-images.tar   # 이미지가 없다면 먼저 로드
#   docker compose --profile infra up -d --build
#
# 개발용 기본값은 각 서비스 SecurityConfig 가 permitAll 이므로
# Gateway/Auth 없이도 서비스 단독 호출이 가능하다.

name: msa-base

services:

  # ---------- 인프라 ----------

  mariadb:
    image: mariadb:11.2
    container_name: msa-db
    environment:
      MYSQL_ROOT_PASSWORD: SqlDba-1
      MYSQL_DATABASE: msa_db
      MYSQL_USER: manager
      MYSQL_PASSWORD: SqlDba-1
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - msa-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: msa-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - msa-net

  # ---------- 서비스 디스커버리 ----------

  eureka-server:
    build:
      context: ./eureka-server
    container_name: msa-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - msa-net

  # ---------- Java 마이크로서비스 ----------

  user-service:
    build:
      context: ./user-service
    container_name: msa-user
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://msa-db:3306/msa_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - msa-net

  course-service:
    build:
      context: ./course-service
    container_name: msa-course
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://msa-db:3306/msa_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - msa-net

  enrollment-service:
    build:
      context: ./enrollment-service
    container_name: msa-enrollment
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://msa-db:3306/msa_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - msa-net

  payment-service:
    build:
      context: ./payment-service
    container_name: msa-payment
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://msa-db:3306/msa_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - msa-net

  # ---------- Python 마이크로서비스 ----------

  recommend-service:
    build:
      context: ./recommend-service
    container_name: msa-recommend
    ports:
      - "8085:8085"
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - EUREKA_INSTANCE_HOST=recommend-service
      - COURSE_SERVICE_URL=http://course-service:8082
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_PAYMENT_COMPLETED=payment.completed
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - msa-net

  ai-screening-service:
    build:
      context: ./ai-screening-service
    container_name: msa-ai-screening
    ports:
      - "8086:8086"
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - EUREKA_INSTANCE_HOST=ai-screening-service
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_ORDER_CREATED=order.created
      - KAFKA_TOPIC_SCREENING_COMPLETED=screening.completed
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - msa-net

  # ---------- 프런트엔드 ----------

  vue-frontend:
    build:
      context: ./vue-frontend
    container_name: msa-frontend
    ports:
      - "3000:80"
    networks:
      - msa-net

  # ---------- 선택: Auth Server + API Gateway (사전 빌드 이미지, profile=infra) ----------
  # infra-images.tar 를 load 한 뒤 --profile infra 로 실행할 때만 사용.

  auth-server:
    image: msa-lecture/auth-server:1.0
    container_name: msa-auth
    profiles: ["infra"]
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://msa-db:3306/msa_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - msa-net

  api-gateway:
    image: msa-lecture/api-gateway:1.0
    container_name: msa-gateway
    profiles: ["infra"]
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - msa-net

volumes:
  mariadb_data:
  kafka_data:

networks:
  msa-net:
    driver: bridge
