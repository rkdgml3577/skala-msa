spring:
  datasource:
    url: jdbc:h2:mem:course_test;MODE=MariaDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    discovery:
      enabled: false
  kafka:
    bootstrap-servers: localhost:1
    listener:
      auto-startup: false
    admin:
      fail-fast: false
eureka:
  client:
    enabled: false
screening:
  scheduler:
    enabled: false
kafka:
  topic:
    security-updated: security.updated
    screening-completed: screening.completed
    anomaly-detected: anomaly.detected
