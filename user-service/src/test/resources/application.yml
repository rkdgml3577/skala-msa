spring:
  datasource:
    url: jdbc:h2:mem:user_test;MODE=MariaDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    discovery:
      enabled: false
  kafka:
    bootstrap-servers: localhost:1
    admin:
      fail-fast: false
    listener:
      auto-startup: false
    consumer:
      group-id: user-service-ai-audit-test
eureka:
  client:
    enabled: false
service:
  enrollment-service:
    url: http://localhost:1
kafka:
  topic:
    trade-received: trade.received
    ai-screening-completed: ai.screening.completed
